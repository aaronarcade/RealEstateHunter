name: Scrape US Active Markets

on:
  workflow_dispatch:
    inputs:
      markets:
        description: Comma-separated market IDs (default all five TASK-015 markets)
        required: false
        default: tampa-fl,jacksonville-fl,birmingham-al,memphis-tn,cleveland-oh
      condo_only:
        description: Pass --condo-only to Redfin GIS pulls
        required: false
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Scrape markets
        run: |
          set -euo pipefail
          ARGS="--markets ${{ inputs.markets }}"
          if [ "${{ inputs.condo_only }}" = "true" ]; then
            ARGS="$ARGS --condo-only"
          fi
          node scripts/scrape-us-active-markets.mjs $ARGS

      - name: Commit scrape outputs to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scrapes/*-active-listings-*.json
          if git diff --cached --quiet; then
            echo "No new scrape files to commit"
            exit 0
          fi
          git commit -m "data(TASK-015): US ACTIVE market bulk scrape outputs"
          git push

      - name: Upload scrape artifacts
        uses: actions/upload-artifact@v4
        with:
          name: us-active-market-scrapes
          path: data/scrapes/*-active-listings-2026-*.json
          if-no-files-found: error
